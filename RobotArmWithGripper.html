<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>CUBE</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
    <script type="importmap">
        {
          "imports": {
            "three": "https://unpkg.com/three/build/three.module.js",
            "three/addons/": "https://unpkg.com/three/examples/jsm/"
          }
        }
    </script>
</head>

<body>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Create scene
        const scene = new THREE.Scene();

        // Create camera
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;

        // Create renderer
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor("#000000");
        document.body.appendChild(renderer.domElement);

        // Add controls
        const controls = new OrbitControls(camera, renderer.domElement);

        const material = new THREE.MeshNormalMaterial();
        const extrudeMaterial = new THREE.MeshNormalMaterial();

        // ----------------------------
        // Retângulo grande - debaixo da base
        // ----------------------------
        const rectangleGeometry = new THREE.BoxGeometry(20, 0.5, 12);
        const rectangle = new THREE.Mesh(rectangleGeometry, material);
        rectangle.position.y = -0.425; // debaixo da base (metade da altura do cube + metade da altura do retângulo)
        scene.add(rectangle);

        // ----------------------------
        // Pernas da mesa (4 cilindros nas esquinas)
        // ----------------------------
        const legGeometry = new THREE.CylinderGeometry(0.3, 0.3, 8, 16); // altura aumentada para 8 (quádruplo)
        const legMaterial = new THREE.MeshNormalMaterial();
        
        // Perna frente esquerda
        const leg1 = new THREE.Mesh(legGeometry, legMaterial);
        leg1.position.set(-9, -4.175, -5.5); // esquina frente esquerda (ajustado para altura 8)
        scene.add(leg1);
        
        // Perna frente direita
        const leg2 = new THREE.Mesh(legGeometry, legMaterial);
        leg2.position.set(9, -4.175, -5.5); // esquina frente direita (ajustado para altura 8)
        scene.add(leg2);
        
        // Perna trás esquerda
        const leg3 = new THREE.Mesh(legGeometry, legMaterial);
        leg3.position.set(-9, -4.175, 5.5); // esquina trás esquerda (ajustado para altura 8)
        scene.add(leg3);
        
        // Perna trás direita
        const leg4 = new THREE.Mesh(legGeometry, legMaterial);
        leg4.position.set(9, -4.175, 5.5); // esquina trás direita (ajustado para altura 8)
        scene.add(leg4);

        // ----------------------------
        // Base (cube) - fixa na cena
        // ----------------------------
        const geometry = new THREE.BoxGeometry(4, 0.35, 4);
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);

        // ----------------------------
        // Ombro pivot - no topo da base
        // ----------------------------
        const ombroPivot = new THREE.Object3D();
        ombroPivot.position.y = 0.175; // metade da altura do cube (0.35/2)
        cube.add(ombroPivot);

        // Helper para visualizar o pivot do ombro (opcional)
        // const ombroHelper = new THREE.AxesHelper(0.5);
        // ombroPivot.add(ombroHelper);

        // ----------------------------
        // Cylinder - pivot que controla a primeira parte do braço
        // ----------------------------
        const cylinderGeometry = new THREE.CylinderGeometry( 1, 1, 0.5, 10 );
        const cylinder = new THREE.Mesh( cylinderGeometry, material );
        cylinder.position.y = 0.25; // metade da altura do cylinder (0.5/2)
        ombroPivot.add( cylinder );

        // ----------------------------
        // Primeira parte do braço (mesh1) - filha do cylinder
        // ----------------------------
        const shape1 = new THREE.Shape();
        shape1.moveTo( 0,0 );
        shape1.lineTo( 0, 1 );
        shape1.lineTo( 4, 1 );
        shape1.lineTo( 4, 0 );
        shape1.lineTo( 0, 0 );
        const extrudeGeometry1 = new THREE.ExtrudeGeometry( shape1 );
        const mesh1 = new THREE.Mesh( extrudeGeometry1, extrudeMaterial );
        mesh1.rotation.x = -Math.PI/2;
        mesh1.rotation.y = Math.PI/2;
        mesh1.position.set(-0.5, 4, 0.5); // posição relativa ao cylinder (no topo)
        cylinder.add( mesh1 );
        
        // ----------------------------
        // Segunda articulação pivot - no fim do mesh1
        // ----------------------------
        const pivot2 = new THREE.Object3D();
        pivot2.position.set(0.5, 0, 0.5); // fim do mesh1 (4 - 0.5)
        pivot2.rotation.z = -Math.PI/6; // inclinar 30 graus para cima (rotação em Z)
        mesh1.add(pivot2);

        
        
        // ----------------------------
        // Segunda parte do braço (mesh2)
        // ----------------------------
        const shape2 = new THREE.Shape();
        shape2.moveTo( 0,0 );
        shape2.lineTo( 0, 1 );
        shape2.lineTo( 2, 1 ); // tamanho reduzido para 2
        shape2.lineTo( 2, 0 );
        shape2.lineTo( 0, 0 );
        const extrudeGeometry2 = new THREE.ExtrudeGeometry( shape2 );
        const mesh2 = new THREE.Mesh( extrudeGeometry2, extrudeMaterial );
        mesh2.rotation.x = -Math.PI/2;
        mesh2.rotation.y = Math.PI/2;
        mesh2.position.set(-0.5, 0, 0.5); // posição relativa ao pivot2
        pivot2.add( mesh2 );
        
        // ----------------------------
        // Esfera - articulação no fim do mesh2 (metade dentro, metade fora)
        // ----------------------------
        const sphereRadius = 0.6;
        const sphereGeometry = new THREE.SphereGeometry(sphereRadius, 32, 32);
        const sphereMaterial = new THREE.MeshNormalMaterial();
        const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
        // Posicionar para que metade fique dentro e metade fora na ponta do mesh2
        // O mesh2 termina em x = 1.5 (2 - 0.5), então o centro da esfera fica em x = 1.5 + raio/2
        sphere.position.set(1.5 + sphereRadius / 2, 0.5, 0.5); // metade dentro, metade fora
        mesh2.add(sphere);
        
        // ----------------------------
        // Terceira articulação pivot - no centro da esfera
        // ----------------------------
        const pivot3 = new THREE.Object3D();
        pivot3.position.set(1.5 + sphereRadius / 2, 0.5, 0.5); // centro da esfera
        mesh2.add(pivot3);
        
        // ----------------------------
        // Terceira parte do braço (mesh3) - topo, roda dentro da esfera
        // ----------------------------
        const shape3 = new THREE.Shape();
        shape3.moveTo( 0,0 );
        shape3.lineTo( 0, 1 );
        shape3.lineTo( 3, 1 );
        shape3.lineTo( 3, 0 );
        shape3.lineTo( 0, 0 );
        const extrudeGeometry3 = new THREE.ExtrudeGeometry( shape3 );
        const mesh3 = new THREE.Mesh( extrudeGeometry3, extrudeMaterial );
        mesh3.rotation.x = -Math.PI/2;
        mesh3.rotation.y = Math.PI/2;
        // Posicionar o mesh3 para começar dentro da esfera (próximo ao centro)
        // O mesh3 começa dentro da esfera e se estende para fora
        mesh3.position.set(sphereRadius / 2, 0.5, 0.5); // começa dentro da esfera
        pivot3.add( mesh3 );
        
        // ----------------------------
        // Esfera - articulação no fim do mesh3 (metade dentro, metade fora)
        // ----------------------------
        const sphere3Radius = 0.6;
        const sphere3Geometry = new THREE.SphereGeometry(sphere3Radius, 32, 32);
        const sphere3Material = new THREE.MeshNormalMaterial();
        const sphere3 = new THREE.Mesh(sphere3Geometry, sphere3Material);
        // Posicionar para que metade fique dentro e metade fora na ponta do mesh3
        // O mesh3 termina em x = 2.5 (3 - 0.5), então o centro da esfera fica em x = 2.5 + raio/2
        sphere3.position.set(2.5 + sphere3Radius / 2, 0.5, 0.5); // metade dentro, metade fora
        mesh3.add(sphere3);

        // ----------------------------
        // Garra - na ponta do mesh3
        // ----------------------------
       

        // Rotation speed (in radians per key press)
        const rotationSpeed = 0.1;

        // Keyboard controls for rotations
        document.addEventListener('keydown', (event) => {
            switch(event.key.toLowerCase()) {
                
                // Ombro pivot - rotaciona todo o braço
                case 'q':
                    ombroPivot.rotation.y -= rotationSpeed;
                    break;
                case 'w':
                    ombroPivot.rotation.y += rotationSpeed;
                    break;

                // Primeira articulação (pivot2) - rotaciona apenas mesh1
                case 'e':
                    pivot2.rotation.z -= rotationSpeed;
                    break;
                case 'r':
                    pivot2.rotation.z += rotationSpeed;
                    break;
                
                
                // Terceira articulação (pivot3) - rotaciona apenas mesh3 (topo)
                case '1':
                    pivot3.rotation.x -= rotationSpeed;
                    break;
                case '2':
                    pivot3.rotation.x += rotationSpeed;
                    break;
                case '3':
                    pivot3.rotation.z -= rotationSpeed;
                    break;
                case '4':
                    pivot3.rotation.z += rotationSpeed;
                    break;
            }
        });

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            
            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>

</body>

</html>
