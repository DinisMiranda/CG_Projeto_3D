<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>CUBE</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
    <script type="importmap">
        {
          "imports": {
            "three": "https://unpkg.com/three/build/three.module.js",
            "three/addons/": "https://unpkg.com/three/examples/jsm/"
          }
        }
    </script>
</head>

<body>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Create scene
        const scene = new THREE.Scene();

        // Create camera
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;

        // Create renderer
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor("#000000");
        document.body.appendChild(renderer.domElement);

        // Add controls
        const controls = new OrbitControls(camera, renderer.domElement);

        // Create cube
        const geometry = new THREE.BoxGeometry(2, 0.35, 2);
        const material = new THREE.MeshNormalMaterial();
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);

        // Create cylinder
        const cylinderGeometry = new THREE.CylinderGeometry( 1, 1, 0.5, 10 );
        const cylinderMaterial = new THREE.MeshNormalMaterial();
        const cylinder = new THREE.Mesh( cylinderGeometry, cylinderMaterial );
        cylinder.position.set(0, 0.3, 0);
        scene.add( cylinder );

        // Create rectangular shape on top of cylinder
        const length = 5, width = 1;
        const shape = new THREE.Shape();
        shape.moveTo( 0,0 );
        shape.lineTo( 0, width );
        shape.lineTo( length, width );
        shape.lineTo( length, 0 );
        shape.lineTo( 0, 0 );
        const extrudeGeometry = new THREE.ExtrudeGeometry( shape );
        const extrudeMaterial = new THREE.MeshNormalMaterial();
        const mesh = new THREE.Mesh( extrudeGeometry, extrudeMaterial );
        // Position on top of cylinder (cylinder top is at y = 0.3 + 0.25 = 0.55)
        // Rotate to lay flat on top (rotate 90 degrees around X axis)
        mesh.rotation.x = -Math.PI/2;
        mesh.rotation.y = Math.PI/2;
        // Center the shape and position on top of cylinder
        // ExtrudeGeometry default depth is 1, so center is at y = 0.55 + 0.5 = 1.05
        mesh.position.set(-0.5, 5, 0.5);
        scene.add( mesh );

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            
            // Rotate cube
            // cube.rotation.x += 0.01;
            // cube.rotation.y += 0.01;
            
            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>

</body>

</html>
