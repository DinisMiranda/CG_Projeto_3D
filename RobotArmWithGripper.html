<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>CUBE</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
    <script type="importmap">
        {
          "imports": {
            "three": "https://unpkg.com/three/build/three.module.js",
            "three/addons/": "https://unpkg.com/three/examples/jsm/"
          }
        }
    </script>
</head>

<body>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Create scene
        const scene = new THREE.Scene();

        // Create camera
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;

        // Create renderer
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setClearColor("#000000");
        document.body.appendChild(renderer.domElement);

        // Add controls
        const controls = new OrbitControls(camera, renderer.domElement);

        // Create cube
        const geometry = new THREE.BoxGeometry(2, 0.35, 2);
        const material = new THREE.MeshNormalMaterial();
        const cube = new THREE.Mesh(geometry, material);
        scene.add(cube);

        // Create cylinder
        const cylinderGeometry = new THREE.CylinderGeometry( 1, 1, 0.5, 10 );
        const cylinderMaterial = new THREE.MeshNormalMaterial();
        const cylinder = new THREE.Mesh( cylinderGeometry, cylinderMaterial );
        cylinder.position.set(0, 0.3, 0);
        scene.add( cylinder );

        // Create rectangular shape on top of cylinder
        const extrudeMaterial = new THREE.MeshNormalMaterial();
        
        // First rectangular shape
        const shape1 = new THREE.Shape();
        shape1.moveTo( 0,0 );
        shape1.lineTo( 0, 1 );
        shape1.lineTo( 4, 1 );
        shape1.lineTo( 4, 0 );
        shape1.lineTo( 0, 0 );
        const extrudeGeometry1 = new THREE.ExtrudeGeometry( shape1 );
        const mesh1 = new THREE.Mesh( extrudeGeometry1, extrudeMaterial );
        mesh1.rotation.x = -Math.PI/2;
        mesh1.rotation.y = Math.PI/2;
        mesh1.position.set(-0.5, 4, 0.5);
        scene.add( mesh1 );
        
        // Second rectangular shape (stacked on top)
        const shape2 = new THREE.Shape();
        shape2.moveTo( 0,0 );
        shape2.lineTo( 0, 1 );
        shape2.lineTo( 3, 1 );
        shape2.lineTo( 3, 0 );
        shape2.lineTo( 0, 0 );
        const extrudeGeometry2 = new THREE.ExtrudeGeometry( shape2 );
        const mesh2 = new THREE.Mesh( extrudeGeometry2, extrudeMaterial );
        mesh2.rotation.x = -Math.PI/2;
        mesh2.rotation.y = Math.PI/2;
        mesh2.position.set(-0.5, 7, 0.5); 
        scene.add( mesh2 );
        
        // Third rectangular shape (stacked on top of second)
        const shape3 = new THREE.Shape();
        shape3.moveTo( 0,0 );
        shape3.lineTo( 0, 1 );
        shape3.lineTo( 3, 1 );
        shape3.lineTo( 3, 0 );
        shape3.lineTo( 0, 0 );
        const extrudeGeometry3 = new THREE.ExtrudeGeometry( shape3 );
        const mesh3 = new THREE.Mesh( extrudeGeometry3, extrudeMaterial );
        mesh3.rotation.x = -Math.PI/2;
        mesh3.rotation.y = Math.PI/2;
        mesh3.position.set(-0.5, 10, 0.5); 
        scene.add( mesh3 );

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            
            // Rotate cube
            // cube.rotation.x += 0.01;
            // cube.rotation.y += 0.01;
            
            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>

</body>

</html>
